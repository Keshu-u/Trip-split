<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Trip Split</title>
<meta name="theme-color" content="#110b29">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ================= THEME COLOURS ================= */
  :root, [data-theme="day"]{
    --bg:#fff3dc; --bg-dot:#ffd7a1; --card:#ffffff; --card2:#fff8ec;
    --ink:#2a1238; --muted:#7b6680; --ol:#2a1238;
    --pink:#ff3d7f; --mari:#ffb703; --teal:#00b3a1; --indigo:#5b3cc4; --green:#2fb36d; --sky:#4cc9f0; --orange:#ff7a1a;
    --good:#13915a; --bad:#e0344f;
    --shadow:4px 4px 0 var(--ol); --shadow-sm:2px 2px 0 var(--ol);
    --field:#fffdf8; --chipbg:#ffe9b3;
    --hero1:#ff3d7f; --hero2:#ff9a1f;
    --svg-ol:#2a1238; --svg-fo:1; --svg-glow:none;
  }
  [data-theme="night"]{
    --bg:#110b29; --bg-dot:#241a4f; --card:#1b1340; --card2:#221850;
    --ink:#f7edff; --muted:#a99ccb; --ol:#8f72ff;
    --pink:#ff4fae; --mari:#ffd23f; --teal:#2ef2d6; --indigo:#a98bff; --green:#5dff9d; --sky:#5fd8ff; --orange:#ff9a3d;
    --good:#5dff9d; --bad:#ff6b8b;
    --shadow:0 0 0 1px rgba(143,114,255,.5), 0 0 18px rgba(143,114,255,.35);
    --shadow-sm:0 0 10px rgba(143,114,255,.4);
    --field:#150e33; --chipbg:#3a2a7a;
    --hero1:#2a1a66; --hero2:#120b33;
    --svg-ol:#2ef2d6; --svg-fo:.22; --svg-glow:drop-shadow(0 0 3px var(--svg-ol)) drop-shadow(0 0 8px var(--svg-ol));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;color:var(--ink);background:var(--bg);
    font-family:"Baloo 2","Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35;
    transition:background-color .5s,color .5s}
  body{background-image:radial-gradient(circle,var(--bg-dot) 1.6px,transparent 2.2px);background-size:24px 24px;min-height:100vh;overflow-x:hidden}
  button,input,select{font:inherit;color:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px;position:relative}
  .good{color:var(--good)} .bad{color:var(--bad)} .muted{color:var(--muted)}

  /* ================= SKY: stars, moon, kite, lantern ================= */
  .sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .stars{position:absolute;inset:0;opacity:0;transition:opacity .8s;
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#fff,transparent),
      radial-gradient(1.5px 1.5px at 160px 60px,#ffe9a8,transparent),radial-gradient(1px 1px at 230px 180px,#fff,transparent),
      radial-gradient(2px 2px at 300px 40px,#c9b8ff,transparent),radial-gradient(1px 1px at 340px 220px,#fff,transparent);
    background-size:360px 260px}
  .stars.s2{background-position:120px 90px;animation:twinkle 3s ease-in-out infinite}
  [data-theme="night"] .stars{opacity:.9}
  .floaty{position:absolute;width:64px;transition:opacity .6s}
  @keyframes kite{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(-14px,-18px) rotate(10deg)}}
  @keyframes lantern{0%{transform:translate(0,40px)}50%{transform:translate(16px,-10px)}100%{transform:translate(0,40px)}}
  @keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}

  /* ================= HEADER + BUNTING / FAIRY LIGHTS ================= */
  header.top{position:sticky;top:0;z-index:20;background:var(--bg);transition:background-color .5s}
  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:6px}
  .eyebrow{font-size:12px;color:var(--pink);font-weight:800;letter-spacing:.12em;text-transform:uppercase}
  h1{font-size:24px;margin:0;font-weight:800;line-height:1.1}
  [data-theme="night"] h1{text-shadow:0 0 12px rgba(255,79,174,.55)}
  .top-right{display:flex;gap:6px;align-items:center}
  .icon-btn{border:2.5px solid var(--ol);background:var(--card);border-radius:14px;width:40px;height:40px;cursor:pointer;font-size:18px;font-weight:800;
    box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;transition:transform .15s}
  .icon-btn:active{transform:scale(.9) rotate(-6deg)}
  .theme-btn{position:relative;overflow:hidden}
  .theme-btn .sun,.theme-btn .mn{position:absolute;transition:transform .5s cubic-bezier(.5,1.8,.5,1),opacity .3s}
  [data-theme="day"] .theme-btn .mn{transform:translateY(30px) rotate(90deg);opacity:0}
  [data-theme="night"] .theme-btn .sun{transform:translateY(-30px) rotate(-90deg);opacity:0}
  .sync{display:flex;align-items:center;gap:6px;border:2.5px solid var(--ol);background:var(--card);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;box-shadow:var(--shadow-sm);max-width:130px;white-space:nowrap;overflow:hidden}
  .dot{width:9px;height:9px;border-radius:50%;background:#bbb;flex-shrink:0}
  .dot.ok{background:var(--good);box-shadow:0 0 8px var(--good)} .dot.err{background:var(--bad)} .dot.busy{background:var(--mari);animation:pulse 1s infinite} .dot.local{background:#999}
  @keyframes pulse{50%{transform:scale(1.5)}}
  .bunting{height:26px;position:relative;overflow:hidden}
  .bunting::before{content:"";position:absolute;left:-10px;right:-10px;top:3px;height:12px;border-top:2px solid var(--ol);border-radius:50%}
  .bunting .fl{position:absolute;top:5px;width:16px;height:18px;transform-origin:top center;animation:sway 2.4s ease-in-out infinite;
    clip-path:polygon(0 0,100% 0,50% 100%);transition:all .5s}
  .bunting .fl:nth-child(5n+1){background:var(--pink)} .bunting .fl:nth-child(5n+2){background:var(--mari)}
  .bunting .fl:nth-child(5n+3){background:var(--teal)} .bunting .fl:nth-child(5n+4){background:var(--indigo)} .bunting .fl:nth-child(5n){background:var(--green)}
  [data-theme="night"] .bunting .fl{clip-path:none;width:9px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;top:9px;
    box-shadow:0 0 8px currentColor,0 0 16px currentColor;animation:bulb 1.6s ease-in-out infinite}
  [data-theme="night"] .bunting .fl:nth-child(5n+1){color:var(--pink)} [data-theme="night"] .bunting .fl:nth-child(5n+2){color:var(--mari)}
  [data-theme="night"] .bunting .fl:nth-child(5n+3){color:var(--teal)} [data-theme="night"] .bunting .fl:nth-child(5n+4){color:var(--indigo)} [data-theme="night"] .bunting .fl:nth-child(5n){color:var(--green)}
  @keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
  @keyframes bulb{0%,100%{opacity:1;filter:brightness(1.2)}50%{opacity:.35;filter:brightness(.7)}}

  /* ================= LAYOUT / VIEWS ================= */
  main{padding:6px 0 120px;position:relative;z-index:1}
  .view{display:none} .view.on{display:block;animation:viewIn .45s cubic-bezier(.3,1.5,.5,1)}
  @keyframes viewIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}

  .card{background:var(--card);border:2.5px solid var(--ol);border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow);transition:background-color .5s,box-shadow .5s,border-color .5s}
  .card h2{font-size:17px;margin:0 0 8px;font-weight:800;display:flex;align-items:center;gap:6px}
  .card h2 .em{font-size:20px;display:inline-block;animation:wiggle 3s ease-in-out infinite}
  @keyframes wiggle{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-14deg)}96%{transform:rotate(12deg)}}

  /* ================= HERO (your balance) ================= */
  .hero{position:relative;overflow:hidden;padding:20px 18px 0;color:#fff;
    background:linear-gradient(135deg,var(--hero1),var(--hero2));min-height:200px}
  [data-theme="night"] .hero{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink),0 0 24px rgba(255,79,174,.45)}
  .hero .label{font-size:15px;font-weight:700;opacity:.95;position:relative;z-index:2}
  .hero .big{font-size:44px;font-weight:800;line-height:1.05;position:relative;z-index:2;animation:popBig .7s cubic-bezier(.3,1.8,.5,1);
    text-shadow:3px 3px 0 rgba(42,18,56,.35)}
  [data-theme="night"] .hero .big{text-shadow:0 0 10px currentColor,0 0 24px currentColor}
  .hero .big.good{color:#fff} .hero .big.bad{color:#fff}
  [data-theme="night"] .hero .big.good{color:var(--good)} [data-theme="night"] .hero .big.bad{color:var(--bad)}
  .hero .place{position:relative;z-index:2;font-size:12px;font-weight:700;opacity:.85;margin-top:4px}
  .hero .scene{position:absolute;right:-6px;bottom:-4px;width:58%;max-width:230px;z-index:1}
  .hero .diyas{position:absolute;left:12px;bottom:8px;display:flex;gap:10px;z-index:2;opacity:0;transition:opacity .6s}
  [data-theme="night"] .hero .diyas{opacity:1}
  .hero .road{height:34px}
  @keyframes popBig{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}

  /* ================= LANDMARK SVG PAINT ================= */
  .lm .o{stroke:var(--svg-ol);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;transition:stroke .6s,fill-opacity .6s}
  .lm{filter:var(--svg-glow);transition:filter .6s}
  .lm .w{fill:#fffaf0} .lm .p{fill:#ff8fb8} .lm .y{fill:#ffc93c} .lm .t{fill:#3fd1c0} .lm .g{fill:#57c46c} .lm .b{fill:#68c7f2} .lm .r{fill:#e86a3a} .lm .k{fill:#2a1238}
  [data-theme="night"] .lm .w,[data-theme="night"] .lm .p,[data-theme="night"] .lm .y,[data-theme="night"] .lm .t,[data-theme="night"] .lm .g,[data-theme="night"] .lm .b,[data-theme="night"] .lm .r{fill-opacity:var(--svg-fo)}
  [data-theme="night"] .lm.c-pink{--svg-ol:#ff4fae} [data-theme="night"] .lm.c-gold{--svg-ol:#ffd23f}
  [data-theme="night"] .lm.c-teal{--svg-ol:#2ef2d6} [data-theme="night"] .lm.c-lime{--svg-ol:#7dff6b} [data-theme="night"] .lm.c-sky{--svg-ol:#5fd8ff} [data-theme="night"] .lm.c-violet{--svg-ol:#b99bff}

  /* diya */
  .diya{width:26px;height:30px}
  .diya .flame{transform-origin:13px 14px;animation:flicker .18s ease-in-out infinite alternate}
  [data-theme="night"] .diya{filter:drop-shadow(0 0 6px #ffb02e) drop-shadow(0 0 14px #ff7a1a)}
  @keyframes flicker{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}

  /* ================= AUTO RICKSHAW ================= */
  .auto .beam{opacity:0;transition:opacity .4s}
  [data-theme="night"] .auto .beam{opacity:.9}
  [data-theme="night"] .auto{filter:drop-shadow(0 0 4px #ffd23f)}
  .auto .wh{transform-box:fill-box;transform-origin:center;animation:spin .4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .road-strip{position:relative;height:58px;overflow:hidden;margin:4px -16px 0}
  .road-strip::after{content:"";position:absolute;left:0;right:0;bottom:6px;border-bottom:3px dashed var(--muted);opacity:.5}
  .road-strip .veh{position:absolute;left:-90px;animation:drive 7s linear forwards}
  .road-strip .veh.cyc .wh{animation-duration:.9s}
  @keyframes drive{from{left:-80px}to{left:105%}}

  /* ================= MARQUEE OF INDIA ================= */
  .marquee{overflow:hidden;margin:0 -16px;padding:6px 0 0}
  .marquee .track{display:flex;gap:18px;width:max-content;animation:scrollX 38s linear infinite}
  .marquee .lmk{width:110px;text-align:center;font-size:11px;font-weight:800;color:var(--muted)}
  .marquee .lmk svg{width:110px;height:74px;display:block}
  @keyframes scrollX{to{transform:translateX(-50%)}}
  .welcome{text-align:center;padding:18px 16px 8px;background:linear-gradient(160deg,var(--card),var(--card2))}
  .welcome .big-title{font-size:30px;font-weight:800;line-height:1.05}
  .welcome .big-title span{color:var(--pink)}
  [data-theme="night"] .welcome .big-title span{text-shadow:0 0 12px var(--pink)}

  /* ================= ROWS / CHIPS / TABLE ================= */
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:2px dashed color-mix(in srgb,var(--muted) 35%,transparent)}
  .row:first-of-type{border-top:none}
  .settle-row .who{flex:1}
  .settle-row .amtline{font-weight:800;font-size:18px}
  .chip{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--chipbg);color:var(--ink);margin-left:4px;vertical-align:middle;border:1.5px solid var(--ol)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:right;color:var(--muted);font-weight:700;font-size:12px;padding:6px 0}
  th:first-child,td:first-child{text-align:left}
  td{text-align:right;padding:9px 0;border-top:2px dashed color-mix(in srgb,var(--muted) 30%,transparent)}
  .av{display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;border:2px solid var(--ol);margin-right:6px;vertical-align:middle}
  [data-theme="night"] .av{box-shadow:0 0 8px currentColor;color:#110b29}

  /* ================= BUTTONS ================= */
  .btn{border:2.5px solid var(--ol);background:var(--mari);color:#2a1238;border-radius:12px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:800;box-shadow:var(--shadow-sm);transition:transform .12s}
  .btn.small{padding:5px 10px;font-size:13px}
  .btn:active,.primary:active,.ghost:active,.danger:active{transform:translate(2px,2px) scale(.97)}
  .primary{position:relative;width:100%;border:2.5px solid var(--ol);background:var(--pink);color:#fff;border-radius:16px;padding:14px;font-weight:800;font-size:18px;cursor:pointer;margin-top:10px;box-shadow:var(--shadow);transition:transform .12s;letter-spacing:.02em}
  [data-theme="night"] .primary{text-shadow:0 0 8px #fff;box-shadow:0 0 0 1px var(--pink),0 0 22px rgba(255,79,174,.6)}
  [data-theme="night"] .btn{background:transparent;color:var(--mari);border-color:var(--mari);box-shadow:0 0 12px rgba(255,210,63,.4);text-shadow:0 0 6px var(--mari)}
  .danger{width:100%;border:2.5px solid var(--bad);background:transparent;color:var(--bad);border-radius:16px;padding:12px;font-weight:800;cursor:pointer;margin-top:10px}
  .ghost{width:100%;border:2.5px solid var(--ol);background:var(--card);border-radius:16px;padding:12px;cursor:pointer;margin-top:10px;font-weight:800;box-shadow:var(--shadow-sm);transition:transform .12s}
  .linkbtn{background:none;border:none;color:var(--pink);cursor:pointer;font-size:13px;padding:0;font-weight:800}

  /* ================= ACTIVITY ITEMS ================= */
  .day{font-size:13px;font-weight:800;margin:18px 2px 8px;display:inline-block;padding:2px 12px;border-radius:999px;background:var(--chipbg);border:2px solid var(--ol)}
  .item{display:flex;gap:12px;align-items:center;background:var(--card);border:2.5px solid var(--ol);border-radius:18px;padding:11px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;
    box-shadow:var(--shadow-sm);animation:itemIn .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i,0) * 45ms);transition:transform .12s}
  .item:active{transform:scale(.97) rotate(-.5deg)}
  @keyframes itemIn{from{opacity:0;transform:translateX(-30px) rotate(-3deg)}to{opacity:1;transform:none}}
  .item .ico{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:2.5px solid var(--ol);background:var(--c,#ffe9b3)}
  [data-theme="night"] .item .ico{background:transparent;border-color:var(--c);box-shadow:0 0 10px var(--c),inset 0 0 8px var(--c)}
  .item .mid{flex:1;min-width:0}
  .item .title{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .sub{font-size:13px;color:var(--muted);font-weight:600}
  .item .amt{text-align:right;font-weight:800;font-size:16px}
  .item .amt .sub{font-weight:700}
  .item .thumb{width:64px;height:44px;flex-shrink:0}
  .pending{font-size:11px;color:var(--orange);font-weight:800}

  /* ================= FORMS ================= */
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 0;font-weight:700}
  input[type=text],input[type=date],input:not([type]),select{display:block;width:100%;margin-top:5px;border:2.5px solid var(--ol);background:var(--field);border-radius:14px;padding:11px 12px;font-size:16px;color:var(--ink);font-weight:600;transition:box-shadow .2s,transform .2s}
  input:focus,select:focus{outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--pink) 35%,transparent);transform:translateY(-1px)}
  [data-theme="night"] input,[data-theme="night"] select{color-scheme:dark}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:flex;background:var(--card2);border:2.5px solid var(--ol);border-radius:16px;padding:3px;box-shadow:var(--shadow-sm)}
  .seg button{flex:1;border:none;background:transparent;padding:9px;border-radius:12px;cursor:pointer;font-weight:800;color:var(--muted);transition:all .25s cubic-bezier(.3,1.6,.5,1)}
  .seg button.on{background:var(--mari);color:#2a1238;transform:scale(1.03)}
  [data-theme="night"] .seg button.on{background:transparent;color:var(--mari);box-shadow:inset 0 0 0 2px var(--mari),0 0 12px rgba(255,210,63,.5)}
  .seg.small{box-shadow:none;border-width:2px} .seg.small button{padding:4px 10px;font-size:13px}
  .split-head{display:flex;justify-content:space-between;align-items:center;margin:16px 0 6px}
  .split-head span{font-size:13px;color:var(--muted);font-weight:700}
  .srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px dashed color-mix(in srgb,var(--muted) 30%,transparent)}
  .srow:first-child{border-top:none}
  .srow .n{flex:1;font-weight:700}
  .srow input[type=checkbox]{width:22px;height:22px;accent-color:var(--pink)}
  .srow input.ex{width:110px;margin:0;padding:8px 10px;text-align:right}
  .note{font-size:13px;margin-top:8px;color:var(--muted);font-weight:700}
  .note.warn{color:var(--bad)}

  /* ================= NAV ================= */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 0 calc(10px + env(safe-area-inset-bottom))}
  nav.tabs .wrap{display:flex;gap:6px;padding:6px;background:var(--card);border:2.5px solid var(--ol);border-radius:22px;box-shadow:var(--shadow);max-width:528px;margin:0 auto;width:calc(100% - 24px)}
  nav.tabs button{flex:1;border:none;background:transparent;padding:10px 4px;border-radius:16px;cursor:pointer;color:var(--muted);font-weight:800;font-size:15px;transition:all .25s}
  nav.tabs button.on{color:var(--ink);background:var(--chipbg)}
  nav.tabs button.add{background:var(--pink);color:#fff;border:2.5px solid var(--ol);display:flex;align-items:center;justify-content:center;gap:4px;flex:1.2}
  nav.tabs button.add svg{width:30px;animation:bob 1.2s ease-in-out infinite}
  [data-theme="night"] nav.tabs button.add{box-shadow:0 0 16px rgba(255,79,174,.7)}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px) rotate(-3deg)}}

  /* ================= TOAST, STICKER, FX ================= */
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) scale(.6);background:var(--mari);color:#2a1238;border:2.5px solid var(--ol);
    padding:10px 16px;border-radius:16px;font-size:15px;font-weight:800;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.3,1.8,.5,1);z-index:60;max-width:90vw;box-shadow:var(--shadow-sm)}
  #toast.show{opacity:1;transform:translateX(-50%) scale(1)}
  .fx-layer{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
  .fx-auto{position:fixed;width:58px;z-index:55;pointer-events:none;animation:autoRun .9s cubic-bezier(.5,0,.6,1) forwards}
  @keyframes autoRun{0%{transform:translateX(0) translateY(0)}20%{transform:translateX(calc(var(--d) * .2)) translateY(-3px) rotate(-4deg)}
    40%{transform:translateX(calc(var(--d) * .4)) translateY(0) rotate(0)}100%{transform:translateX(var(--d)) translateY(-2px);opacity:.0}}
  .puff{position:fixed;width:12px;height:12px;border-radius:50%;background:#cfc6d6;border:2px solid var(--ol);pointer-events:none;z-index:54;animation:puff .7s ease-out forwards}
  [data-theme="night"] .puff{background:var(--mari);border:none;width:6px;height:6px;box-shadow:0 0 8px var(--mari),0 0 14px var(--orange)}
  @keyframes puff{to{transform:translate(-18px,-14px) scale(2.2);opacity:0}}
  .petal{position:absolute;top:-30px;width:14px;height:18px;border-radius:60% 0 60% 0;animation:fall linear forwards}
  @keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--r))}}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(p){
  const neg = p < 0; p = Math.abs(Math.round(p));
  const s = (p/100).toLocaleString('en-IN',{minimumFractionDigits: p%100 ? 2 : 0, maximumFractionDigits: 2});
  return (neg ? '−' : '') + '₹' + s;
}
function toPaise(str){
  const v = parseFloat(String(str).replace(/[,₹\s]/g,''));
  return isFinite(v) && v > 0 ? Math.round(v*100) : 0;
}
function today(){ return new Date().toLocaleDateString('en-CA'); }
function fmtDay(d){

}
function readLS(k, def){ try{ return JSON.parse(localStorage.getItem(k)) ?? def; }catch(e){ return def; } }

  const m = document.querySelector('meta[name=theme-color]'); if(m) m.content = t === 'night' ? '#110b29' : '#fff3dc'; }

const LANDMARKS = {

    <path class="o r" d="M66 52 V38 Q71 18 77 8 Q83 18 88 38 V52Z"/><path class="o" d="M77 8 V2" fill="none"/><path class="o p" d="M77 2 L85 5 L77 8Z"/>
    <path class="o w" d="M40 52 V40 H56 V52Z"/><path class="o p" d="M36 40 Q48 28 60 40Z"/>

const LM_KEYS = Object.keys(LANDMARKS);
function landmarkSVG(key, cls=''){
  const L = LANDMARKS[key] || LANDMARKS.taj;
  return `<svg class="lm ${L.c} ${cls}" viewBox="0 0 120 80" aria-hidden="true">${L.svg}</svg>`;
}
function sceneFor(id, name=''){
  const n = name.toLowerCase();
  const map = [[/banaras|benaras|varanasi|kashi/,'ghat'],[/agra|taj/,'taj'],[/delhi/,'gate'],[/jaipur|rajasthan|udaipur|jodhpur/,'hawa'],
    [/hyderabad/,'charminar'],[/kerala|munnar|alleppey|kochi/,'kerala'],[/mumbai|bombay/,'gateway'],[/goa|beach|gokarna|pondi/,'beach']];
  for(const [re,k] of map) if(re.test(n)) return k;
  let h = 0; for(const ch of String(id)) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  return LM_KEYS[h % LM_KEYS.length];
}

/* ---- categories: emoji + colour guessed from the description ---- */
const CATS = [
  [/chai|tea|coffee/i,'☕','#ffb703'], [/paan|sweet|mithai|lassi|rabri|malai|jalebi|ice ?cream/i,'🍨','#ff8fb8'],
  [/beer|bar|drink|party|daru/i,'🍻','#ffb703'],
  [/food|dinner|lunch|breakfast|kachori|thali|restaurant|snack|khana|meal|biryani|pizza|dosa|chaat|maggi/i,'🍛','#ff8a3d'],
  [/boat|nav|cruise|ganga|ferry/i,'🛶','#4cc9f0'], [/hotel|stay|room|hostel|airbnb|oyo|homestay/i,'🏨','#a98bff'],
  [/auto|rickshaw|cab|taxi|uber|ola|rapido|bus|metro|petrol|fuel|toto/i,'🛺','#2fb36d'],
  [/train|rail|irctc|flight|plane/i,'🚆','#00b3a1'], [/shop|saree|gift|market|souvenir|clothes/i,'🛍️','#ff3d7f'],
  [/temple|aarti|puja|darshan|mandir|prasad/i,'🪔','#ff7a1a'], [/ticket|entry|museum|show/i,'🎟️','#ffd23f'],
  [/medicine|pharma|doctor/i,'💊','#5fd8ff'], [/water|bisleri|grocer/i,'💧','#4cc9f0'],
];
const FALLBACK_COLORS = ['#ffe066','#9be7ff','#ffb3cf','#b5f5a8','#d6c6ff'];
function catFor(desc, i){ for(const [re,e,c] of CATS) if(re.test(desc||'')) return {e, c}; return {e:'🧾', c:FALLBACK_COLORS[i % FALLBACK_COLORS.length]}; }
const AV_COLORS = ['#ff3d7f','#ff9a1f','#00b3a1','#5b3cc4','#2fb36d','#4cc9f0','#e0344f','#c77dff'];
function avatar(id){
  const i = Math.max(0, (S.members||[]).findIndex(m => m.id === id));
  const n = (typeof nameOf === 'function' ? nameOf(id) : '?').trim();
  const c = AV_COLORS[i % AV_COLORS.length];
  return `<span class="av" style="background:${c};color:${c}"><span style="color:#fff">${esc(n.charAt(0).toUpperCase())}</span></span>`;
}

/* ---- effects ---- */
const fx = {
  layer(){ let l = document.querySelector('.fx-layer'); if(!l){ l = document.createElement('div'); l.className = 'fx-layer'; document.body.appendChild(l); } return l; },
  reduced(){ return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; },

  // the little auto that zooms across any button you tap
  drive(btn){
    if(this.reduced()) return;
    const r = btn.getBoundingClientRect(); if(r.width < 40) return;
    const a = document.createElement('div'); a.className = 'fx-auto'; a.innerHTML = autoSVG();
    const w = Math.min(58, r.height * 1.6);
    a.style.width = w + 'px'; a.style.left = (r.left - w*0.4) + 'px'; a.style.top = (r.top + r.height/2 - w*0.3) + 'px';
    a.style.setProperty('--d', (r.width) + 'px');
    document.body.appendChild(a); setTimeout(() => a.remove(), 950);
    for(let k=0; k<6; k++) setTimeout(() => {
      const p = document.createElement('div'); p.className = 'puff';
      p.style.left = (r.left + (k/6)*r.width - 4) + 'px'; p.style.top = (r.top + r.height/2 + 4) + 'px';
      document.body.appendChild(p); setTimeout(() => p.remove(), 750);
    }, 80 + k*120);
  },

  sticker(text, sub){
    const s = document.createElement('div'); s.className = 'sticker';
    s.innerHTML = esc(text) + (sub ? `<small>${esc(sub)}</small>` : '');
    document.body.appendChild(s); setTimeout(() => s.remove(), 1700);
  },

  petals(n=34){

/* ---------- data store ----------
   Everything is saved as a list of "events" (add/edit/delete), one per row in the sheet.
   Balances are always recalculated from that list, so nothing can get out of sync. */
let serverEvents = SYNC_URL ? readLS(LS_CACHE, []) : readLS(LS_LOCAL, []);
let pending = SYNC_URL ? readLS(LS_PENDING, []) : [];

function allTrips(){
  const m = new Map();
  allEvents().forEach(ev => { if(ev.type === 'trip') m.set(ev.data.tripId, {id: ev.data.tripId, name: ev.data.name, ts: ev.ts}); });
  return m;
}
function tripName(id){ return (allTrips().get(id) || {}).name || 'Trip'; }
let syncState = SYNC_URL ? 'busy' : 'local';
let lastSync = null;

function allEvents(){
  const ids = new Set(serverEvents.map(e => e.id));
  return serverEvents.concat(pending.filter(p => !ids.has(p.id)));
}

async function pull(){
  if(!SYNC_URL){ render(); return; }
  setSync('busy');
  try{
    const r = await fetch(SYNC_URL + (SYNC_URL.includes('?')?'&':'?') + 't=' + Date.now());
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || 'Bad reply');
    serverEvents = j.events;
    writeLS(LS_CACHE, serverEvents);
    const ids = new Set(serverEvents.map(e => e.id));
    pending = pending.filter(p => !ids.has(p.id));
    writeLS(LS_PENDING, pending);
    lastSync = new Date();
    setSync('ok');
  }catch(e){ setSync('err'); }
  loadedOnce = true;
  render();
  if(pending.length) flush();
}

let flushing = false;
async function flush(){
  if(!SYNC_URL || flushing) return;
  flushing = true;
  let ev;
  while((ev = pending[0])){
    try{
      const r = await fetch(SYNC_URL, {method:'POST', body: JSON.stringify(ev)});
      const j = await r.json();
      if(!j.ok) throw new Error(j.error || 'Bad reply');
      pending = pending.filter(p => p.id !== ev.id);
      if(!serverEvents.some(s => s.id === ev.id)) serverEvents.push(ev);
      writeLS(LS_PENDING, pending); writeLS(LS_CACHE, serverEvents);
      lastSync = new Date(); setSync('ok');
    }catch(e){ setSync('err'); break; }
  }
  flushing = false;
  render();
}

function addEvent(type, data){
  if(type !== 'trip') data = Object.assign({trip: currentTrip}, data);
  const ev = {id: uid(), ts: Date.now(), type, data};
  if(SYNC_URL){ pending.push(ev); writeLS(LS_PENDING, pending); render(); flush(); }
  else { serverEvents.push(ev); writeLS(LS_LOCAL, serverEvents); render(); }
}

function setSync(s){
  syncState = s;
  const dot = $('#syncDot'), txt = $('#syncText');
  dot.className = 'dot ' + s;
  const unsent = pending.length;
  if(s==='local') txt.textContent = 'This phone only';
  else if(s==='busy') txt.textContent = 'Syncing…';
  else if(s==='err') txt.textContent = unsent ? `Offline · ${unsent} unsent` : 'Offline';
  else txt.textContent = unsent ? `${unsent} sending…` : 'Synced ' + (lastSync ? lastSync.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}) : '');
}

/* ---------- turn events into balances ---------- */
function buildState(){
  let members = [];
  const items = new Map();
  allEvents().forEach((ev, i) => {
    const d = ev.data || {};
    if(ev.type === 'trip' || d.trip !== currentTrip) return;
    if(ev.type === 'members') members = d.members || [];
    else if(ev.type === 'expense' || ev.type === 'payment') items.set(d.key, {kind: ev.type, data: d, order: i, ts: ev.ts, pending: pending.some(p => p.id === ev.id)});
    else if(ev.type === 'delete') items.delete(d.key);
  });
  const net = {}, paid = {}, share = {};
  const ensure = id => { if(!(id in net)){ net[id]=0; paid[id]=0; share[id]=0; } };
  members.forEach(m => ensure(m.id));
  let total = 0;
  for(const it of items.values()){
    const d = it.data;
    if(it.kind === 'expense'){
      ensure(d.paidBy); net[d.paidBy] += d.amount; paid[d.paidBy] += d.amount; total += d.amount;
      for(const [id, s] of Object.entries(d.split || {})){ ensure(id); net[id] -= s; share[id] += s; }
    } else {
      ensure(d.from); ensure(d.to); net[d.from] += d.amount; net[d.to] -= d.amount;
    }
  }
  return {members, items: [...items.values()], net, paid, share, total};
}

/* Fewest payments needed to clear all debts */
function settlePlan(net){
  const cred = [], deb = [];
  for(const [id, v] of Object.entries(net)){ if(v > 0) cred.push([id, v]); else if(v < 0) deb.push([id, -v]); }
  cred.sort((a,b) => b[1]-a[1]); deb.sort((a,b) => b[1]-a[1]);
  const out = []; let i = 0, j = 0;
  while(i < deb.length && j < cred.length){
    const amt = Math.min(deb[i][1], cred[j][1]);
    if(amt > 0) out.push({from: deb[i][0], to: cred[j][0], amount: amt});
    deb[i][1] -= amt; cred[j][1] -= amt;
    if(deb[i][1] === 0) i++;
    if(cred[j][1] === 0) j++;
  }
  return out;
}

function splitEqual(total, ids){
  const n = ids.length, out = {};
  if(!n) return out;
  const base = Math.floor(total / n); let rem = total - base*n;
  ids.forEach(id => { out[id] = base + (rem > 0 ? 1 : 0); if(rem > 0) rem--; });
  return out;
}

  }
  const split = {};
  box.querySelectorAll('input.ex').forEach(i => { const v = toPaise(i.value); if(v) split[i.dataset.id] = v; });

  const amt = toPaise($('#eAmt').value);

  const {checked, split} = readSplitInputs();
  if(splitMode === 'equal'){
    document.querySelectorAll('[data-per]').forEach(s => s.textContent = split[s.dataset.per] ? money(split[s.dataset.per]) : '');

/* ---------- import from Splitwise ("Export as spreadsheet" .csv) ---------- */
function parseCSV(text){
  const rows = []; let row = [], f = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === ','){ row.push(f); f = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if(f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
function numCents(s){ const v = parseFloat(String(s ?? '').replace(/[,₹\s]/g, '')); return isFinite(v) ? Math.round(v*100) : 0; }
function normDate(s){
  s = String(s || '').trim();
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
  const m2 = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/); if(m2) return `${m2[3]}-${m2[2].padStart(2,'0')}-${m2[1].padStart(2,'0')}`;
  const d = new Date(s); return isNaN(d) ? today() : d.toLocaleDateString('en-CA');
}
function hashStr(s){ let h = 2166136261; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }

function parseSplitwise(text){
  const rows = parseCSV(String(text).replace(/^﻿/, ''));
  const hi = rows.findIndex(r => (r[0]||'').trim().toLowerCase() === 'date');
  if(hi < 0) throw new Error("This doesn't look like a Splitwise export (no Date column).");
  const head = rows[hi].map(s => String(s).trim());
  const ci = n => head.findIndex(x => x.toLowerCase() === n);
  const fixed = {date: ci('date'), desc: ci('description'), cat: ci('category'), cost: ci('cost'), cur: ci('currency')};
  if(fixed.desc < 0 || fixed.cost < 0) throw new Error("Couldn't find the Description and Cost columns.");
  const people = head.map((x,i) => ({name:x, i})).filter(p => p.name && !Object.values(fixed).includes(p.i));
  const items = [];
  for(const r of rows.slice(hi+1)){
    const desc = String(r[fixed.desc] || '').trim();
    if(!desc || /^total balance$/i.test(desc)) continue;
    const nets = {};
    people.forEach(p => { const v = numCents(r[p.i]); if(v) nets[p.name] = v; });
    if(!Object.keys(nets).length) continue;
    items.push({date: normDate(r[fixed.date]), desc, cat: String(r[fixed.cat] || '').trim(), cost: Math.abs(numCents(r[fixed.cost])),
                cur: String(r[fixed.cur] || '').trim(), nets});
  }
  return {people: people.map(p => p.name), items};
}

/* turn one Splitwise row into our expense/payment entries (balances always match Splitwise) */
function swToEntries(item, map){
  const nets = {};
  for(const [n, v] of Object.entries(item.nets)){ const id = map[n]; if(id) nets[id] = (nets[id] || 0) + v; }
  const pos = Object.entries(nets).filter(([,v]) => v > 0), neg = Object.entries(nets).filter(([,v]) => v < 0);
  if(!pos.length || !neg.length) return [];
  const key = 'sw_' + hashStr(item.date + '|' + item.desc + '|' + item.cost + '|' + JSON.stringify(item.nets));
  const isPay = /^payment$/i.test(item.cat) || (/\bpaid\b/i.test(item.desc) && !item.cat && pos.length === 1 && neg.length === 1);
  if(isPay && pos.length === 1 && neg.length === 1)
    return [['payment', {key, from: pos[0][0], to: neg[0][0], amount: pos[0][1], date: item.date}]];
  if(pos.length === 1){
    const [payer, pv] = pos[0];
    const split = {}; let others = 0;
    neg.forEach(([id, v]) => { split[id] = -v; others += -v; });
    const amount = item.cost || pv;
    const payerShare = amount - others;
    if(payerShare >= 0 && Math.abs(pv - others) <= 1){
      if(payerShare > 0) split[payer] = payerShare;
      return [['expense', {key, desc: item.desc, amount, paidBy: payer, date: item.date, mode: 'exact', split}]];
    }
  }
  // several people paid: one entry per payer, shared in proportion (balances stay exact)
  const totalNeg = neg.reduce((a,[,v]) => a - v, 0);
  return pos.map(([payer, pv], k) => {
    const split = {}; let given = 0;
    neg.forEach(([id, v], j) => {
      const s = j === neg.length - 1 ? pv - given : Math.round(pv * (-v) / totalNeg);
      if(s > 0) split[id] = s; given += s;
    });
    return ['expense', {key: key + '_' + k, desc: item.desc + (pos.length > 1 ? ` (${nameOf(payer)}'s part)` : ''), amount: pv, paidBy: payer, date: item.date, mode: 'exact', split}];
  });
}

function guessMember(name){
  const n = name.toLowerCase().trim(), first = n.split(/\s+/)[0];
  return (S.members.find(m => m.name.toLowerCase().trim() === n)
       || S.members.find(m => m.name.toLowerCase().trim().split(/\s+/)[0] === first)
       || S.members.find(m => { const mn = m.name.toLowerCase(); return mn.startsWith(first) || first.startsWith(mn); }) || {}).id || '';
}

  const foreign = [...new Set(d.items.map(x => x.cur).filter(c => c && !/^(inr|rs|₹)$/i.test(c)))];
  box.innerHTML = `
    <div class="card"><h2><span class="em">👥</span> Match the names</h2>
      <div class="muted" style="font-size:14px;font-weight:600">Who is who in this trip? I guessed from the names, so just check them.</div>
      ${mapRows}</div>
    <div class="card"><h2><span class="em">🧾</span> Found</h2>
      <div style="font-weight:700">${d.items.length - pays} expense${d.items.length - pays === 1 ? '' : 's'}${pays ? ` and ${pays} repayment${pays === 1 ? '' : 's'}` : ''}, from ${esc(fmtDay(d.items.map(x=>x.date).sort()[0]))} to ${esc(fmtDay(d.items.map(x=>x.date).sort().pop()))}</div>
      ${foreign.length ? `<div class="note warn">Some rows are in ${esc(foreign.join(', '))}. They'll be imported as ₹ amounts.</div>` : ''}
      <div style="margin-top:8px">${d.items.slice(0,5).map(x => `<div class="row"><span style="font-weight:700">${esc(x.desc)}</span><span>${money(x.cost)}</span></div>`).join('')}
      ${d.items.length > 5 ? `<div class="note">…and ${d.items.length - 5} more</div>` : ''}</div>
      <button class="primary" id="swGo">Import ${d.items.length} items</button>
    </div>`;
  $('#swGo').onclick = doImport;
}
function doImport(){
  const d = importData; if(!d) return;
  const map = {}, newPeople = [];
  document.querySelectorAll('[data-sw]').forEach(s => {
    const name = d.people[+s.dataset.sw];
    if(s.value === '__new'){ const id = 'm' + uid(); newPeople.push({id, name}); map[name] = id; }
    else if(s.value) map[name] = s.value;
  });
  const skipped = d.people.filter(n => !map[n]);
  if(skipped.length && !confirm(`${skipped.join(', ')} will be skipped, so their share won't count. Continue?`)) return;
  if(newPeople.length){ addEvent('members', {members: S.members.concat(newPeople)}); S = buildState(); }
  let n = 0;
  // oldest first, so Activity reads in order
  [...d.items].sort((x,y) => x.date.localeCompare(y.date)).forEach(item => swToEntries(item, map).forEach(([type, data]) => { addEvent(type, data); n++; }));
  importData = null;
  fx.sticker('Import ho gaya! 📥', `${n} entries added`);
  if(isNight()) fx.fireworks(4); else fx.petals(50);
  show('activity');
}

/* ---------- home: list of trips + new trip ---------- */
function wireHomeList(){ $('#v-home').querySelectorAll('[data-trip]').forEach(b => b.onclick = () => goTrip(b.dataset.trip)); }
function renderHome(){
  const trips = allTrips();
  const mine = readLS(LS_TRIPS, []).filter(id => trips.has(id)).map(id => trips.get(id)).sort((a,b) => b.ts - a.ts);
  const list = mine.length ? mine.map((t,i) => { const sk = sceneFor(t.id, t.name); return `<button class="item" style="--i:${i}" data-trip="${esc(t.id)}">
      <div class="thumb">${landmarkSVG(sk)}</div><div class="mid"><div class="title">${esc(t.name)}</div><div class="sub">${esc(LANDMARKS[sk].name)}</div></div><div class="muted" style="font-size:22px;font-weight:800">›</div></button>`; }).join('')
    : `<div class="empty">${(SYNC_URL && !loadedOnce) ? 'Loading…' : 'No trips yet. Create your first one below.'}</div>`;
  if($('#homeList')){ $('#homeList').innerHTML = list; wireHomeList(); return; }
  const strip = LM_KEYS.map(k => `<div class="lmk">${landmarkSVG(k)}${esc(LANDMARKS[k].name.split(' · ')[1])}</div>`).join('');
  $('#v-home').innerHTML = syncBanner() + `
    <div class="card welcome">
      <div class="big-title">Chalo, <span>hisaab</span> karein!</div>
      <div class="muted" style="font-weight:700;margin-top:4px">Split trip kharcha with friends, from Kashmir to Kanyakumari.</div>
      <div class="marquee"><div class="track">${strip}${strip}</div></div>
      <div class="road-strip" data-traffic></div>
    </div>
    <div id="homeList">${list}</div>` + `
    <div class="card" style="margin-top:14px"><h2><span class="em">🧳</span> New trip</h2>
      <label>Trip name<input type="text" id="ntName" maxlength="40" placeholder="e.g. Goa, Dec 2026"></label>
      <label style="margin-top:14px">Who's going?</label>
      <div id="nameList">${Array.from({length:4}, () => nameRow({})).join('')}</div>
      <button type="button" class="ghost" id="addName">＋ Add another person</button>
      <button class="primary" id="ntCreate">Create trip</button>
    </div>`;
  wireHomeList();
  $('#addName').onclick = () => $('#nameList').insertAdjacentHTML('beforeend', nameRow({}));
  $('#ntCreate').onclick = () => {
    const name = $('#ntName').value.trim();
    const members = [...document.querySelectorAll('#v-home .nm')].map(i => i.value.trim()).filter(Boolean)
      .map(n => ({id: 'm' + uid(), name: n}));
    if(!name) return toast('Give the trip a name');
    if(members.length < 2) return toast('Add at least 2 people');
    const id = 't' + uid();
    currentTrip = id;
    addEvent('trip', {tripId: id, name});
    addEvent('members', {members});
    rememberTrip(id);
    goTrip(id);
    fx.party('trip');
  };
}

/* ---------- start ---------- */
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => b.dataset.v === 'add' ? openAdd() : show(b.dataset.v));
$('#gearBtn').onclick = () => { if(!S.members.length) return; renderSettings(); show('settings'); };
$('#homeBtn').onclick = () => goTrip('');
$('#themeBtn').onclick = () => fx.toggleTheme();
$('#bunting').innerHTML = Array.from({length:24}, (_,i) => `<span class="fl" style="left:${i*24+4}px;animation-delay:${(i%6)*.2}s"></span>`).join('');
$('#addTab').innerHTML = autoSVG() + '<span>Add</span>';
window.addEventListener('popstate', () => {
  currentTrip = new URLSearchParams(location.search).get('trip') || '';
  me = currentTrip ? readLS(LS_ME + currentTrip, '') : '';
  view = currentTrip ? 'balances' : 'home'; render(); show(view);
});
$('#syncBtn').onclick = () => { if(!SYNC_URL) return toast('Sync not set up, this phone only'); toast('🔄 ' + $('#syncText').textContent); pull(); };
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') pull(); });
window.addEventListener('online', () => { flush(); pull(); });
if(SYNC_URL) setInterval(() => { if(document.visibilityState === 'visible' && view !== 'add') pull(); }, 30000);

if(!currentTrip) view = 'home';
render();
show(view);
pull();
</script>
